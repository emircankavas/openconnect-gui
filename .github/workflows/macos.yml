name: macOS Build & Release (arm64)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Create a release with this tag (e.g. v1.6.3). Leave empty to only build.'
        required: false
        default: ''

permissions:
  contents: write

env:
  BUILD_TYPE: Release
  DEPLOYMENT_TARGET: "12.0"

jobs:
  build-macos-arm64:
    name: Build macOS arm64 .app
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Runner info
        run: |
          sw_vers
          uname -m
          xcodebuild -version

      - name: Cache Homebrew downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: brew-${{ runner.os }}-${{ runner.arch }}-qt6-openconnect-${{ hashFiles('.github/workflows/macos.yml') }}
          restore-keys: |
            brew-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies (Homebrew)
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
        run: |
          brew install cmake pkg-config qt@6 openconnect gnutls spdlog fmt

      - name: Resolve Qt prefix
        id: qt
        run: |
          set -euo pipefail
          QT_PREFIX="$(brew --prefix qt@6 2>/dev/null || brew --prefix qt6 2>/dev/null || brew --prefix qt)"
          echo "Qt prefix: $QT_PREFIX"
          test -d "$QT_PREFIX/lib/cmake/Qt6"
          echo "prefix=$QT_PREFIX" >> "$GITHUB_OUTPUT"

      - name: Configure (CMake)
        run: |
          set -euo pipefail
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE="${BUILD_TYPE}" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="${DEPLOYMENT_TARGET}" \
            -DQt6_DIR="${{ steps.qt.outputs.prefix }}/lib/cmake/Qt6"

      - name: Build
        run: |
          set -euo pipefail
          cmake --build build --config "${BUILD_TYPE}" --parallel "$(sysctl -n hw.ncpu)"

      - name: Install bundle (CMake install, no fixup_bundle)
        # The project's own fixup_bundle step is broken (install() uses the
        # lowercase ${PROJECT_NAME} while OUTPUT_NAME makes the bundle
        # "OpenConnect-GUI.app", so it otool's a bundle that does not exist).
        # Install only: it produces the .app, macdeployqt handles the rest.
        run: |
          set -euo pipefail
          cmake --install build --prefix dist --config "${BUILD_TYPE}" \
            --component App || {
              echo "::warning::cmake --install --component App failed; falling back to build tree bundle"
            }

      - name: Locate .app bundle
        id: app
        run: |
          set -euo pipefail
          APP_PATH=""
          if [ -d "dist/OpenConnect-GUI.app" ]; then
            APP_PATH="dist/OpenConnect-GUI.app"
          elif [ -d "dist/openconnect-gui.app" ]; then
            APP_PATH="dist/openconnect-gui.app"
          else
            APP_PATH="$(find build dist -maxdepth 4 -name '*.app' -type d 2>/dev/null | head -n1 || true)"
          fi
          if [ -z "$APP_PATH" ]; then
            echo "::error::No .app bundle was produced"
            find build dist -name '*.app' 2>/dev/null || true
            exit 1
          fi
          echo "Found bundle: $APP_PATH"
          du -sh "$APP_PATH"
          echo "path=$APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Deploy Qt frameworks/plugins (macdeployqt)
        env:
          QT_PREFIX: ${{ steps.qt.outputs.prefix }}
        run: |
          set -euo pipefail
          APP="${{ steps.app.outputs.path }}"
          MACDEPLOYQT="$QT_PREFIX/bin/macdeployqt"
          test -x "$MACDEPLOYQT"
          # Homebrew prefixes are not "system", so macdeployqt would refuse to
          # embed them; -libpath makes it treat them as deployable.
          "$MACDEPLOYQT" "$APP" -verbose=1 \
            -libpath="$QT_PREFIX/lib" \
            -libpath=/opt/homebrew/lib \
            -libpath=/opt/homebrew/opt/openconnect/lib \
            -libpath=/opt/homebrew/opt/gnutls/lib \
            -libpath=/opt/homebrew/opt/spdlog/lib \
            -libpath=/opt/homebrew/opt/fmt/lib
          echo "== after macdeployqt =="
          du -sh "$APP"

      - name: Bundle non-Qt dylibs (openconnect/gnutls/spdlog/...)
        run: |
          set -euo pipefail
          APP="${{ steps.app.outputs.path }}"
          bash .github/scripts/bundle_macos_dylibs.sh "$APP"

      - name: Rewrite rpaths to the bundle
        run: |
          set -euo pipefail
          APP="${{ steps.app.outputs.path }}"
          BIN="$APP/Contents/MacOS/OpenConnect-GUI"
          FW_REL="@executable_path/../Frameworks"

          # Ensure the binary can find bundled Frameworks and PlugIns.
          if ! otool -l "$BIN" | grep -A2 LC_RPATH | grep -q "$FW_REL"; then
            install_name_tool -add_rpath "$FW_REL" "$BIN" 2>/dev/null || true
          fi

          # Remove Homebrew/absolute rpaths so nothing resolves outside the app.
          otool -l "$BIN" | awk '/LC_RPATH/{getline; getline; print $2}' | while read -r rp; do
            case "$rp" in
              @*) ;;                       # keep bundle-relative rpaths
              *) install_name_tool -delete_rpath "$rp" "$BIN" 2>/dev/null || true ;;
            esac
          done

          echo "== final rpaths =="
          otool -l "$BIN" | awk '/LC_RPATH/{getline; getline; print "  " $2}'

      - name: Ad-hoc codesign
        run: |
          set -euo pipefail
          APP="${{ steps.app.outputs.path }}"
          codesign --force --deep --sign - "$APP"
          codesign --verify --verbose=2 "$APP" || true

      - name: Verify standalone (no Homebrew paths remain)
        run: |
          set -euo pipefail
          APP="${{ steps.app.outputs.path }}"
          BIN="$APP/Contents/MacOS/OpenConnect-GUI"
          echo "== linked libraries =="
          otool -L "$BIN"
          echo "== bundle size =="
          du -sh "$APP"

          fail=0

          echo "== install-name references outside the bundle? =="
          if find "$APP" -type f -exec sh -c 'otool -L "$1" 2>/dev/null' _ {} \; \
               | grep -E "/opt/homebrew|/usr/local/(opt|Cellar)" ; then
            echo "::error::Bundle still references Homebrew libraries"
            fail=1
          fi

          echo "== symlinks escaping the bundle? (plugins must be real files) =="
          APP_ABS="$(cd "$(dirname "$APP")" && pwd -P)/$(basename "$APP")"
          while IFS= read -r -d '' l; do
            link_target="$(readlink "$l")"
            cur="$(cd "$(dirname "$l")" && pwd -P)"
            real="$(cd "$cur" 2>/dev/null && readlink -f "$link_target" 2>/dev/null || true)"
            if [ -z "$real" ] || [ ! -e "$real" ]; then
              echo "::error::broken symlink ${l#$APP/} -> $link_target"
              fail=1
            elif [ "${real#$APP_ABS/}" = "$real" ]; then
              echo "::error::symlink escapes bundle: ${l#$APP/} -> $real"
              fail=1
            fi
          done < <(find "$APP" -type l -print0)

          echo "== mandatory Qt platform plugin present as a real file? =="
          for p in \
            "$APP/Contents/PlugIns/platforms/libqcocoa.dylib" \
            "$APP/Contents/PlugIns/styles/libqmacstyle.dylib" ; do
            if [ ! -f "$p" ] || [ -L "$p" ]; then
              echo "::error::missing real plugin: ${p#$APP/}"
              fail=1
            fi
          done

          echo "== every dependency resolves to a real FILE? =="
          # A framework install name pointing at the .framework DIRECTORY (not
          # its binary) passes an existence check but dyld aborts the launch
          # with "not a file". Test the file-ness, following symlinks.
          while IFS= read -r f; do
            file -b "$f" 2>/dev/null | grep -q "Mach-O" || continue
            while IFS= read -r dep; do
              case "$dep" in
                /usr/lib/*|/System/*) continue ;;
                */)
                  echo "::error::${f#$APP/} -> '$dep' has a trailing slash (dyld errno 20)"
                  fail=1; continue ;;
                @executable_path/*)
                  cand="$APP/Contents/MacOS/${dep#@executable_path/}" ;;
                @loader_path/*)
                  cand="$(dirname "$f")/${dep#@loader_path/}" ;;
                @rpath/*)
                  cand="$APP/Contents/Frameworks/${dep#@rpath/}" ;;   # best effort
                *)
                  echo "::error::absolute non-system dependency '$dep' in ${f#$APP/}"
                  fail=1; continue ;;
              esac
              if [ ! -f "$cand" ]; then
                echo "::error::${f#$APP/} -> '$dep' does not resolve to a file ($cand)"
                fail=1
              fi
            done < <(otool -L "$f" 2>/dev/null | awk 'NR > 1 { print $1 }')
          done < <(find "$APP" -type f -print0)

          [ "$fail" -eq 0 ] || exit 1
          echo "OK: bundle is self-contained."

      - name: Smoke test — dyld must resolve every library
        # The definitive check: actually launch the binary. A missing or
        # mis-shaped dependency makes dyld abort before main() with
        # "Library not loaded", which no static inspection reliably catches
        # (a reference to the .framework DIRECTORY looks fine to otool).
        # A headless runner will fail later for other reasons (no display,
        # no root), which is fine — we only assert dyld got past loading.
        # NB: macOS ships no GNU `timeout`, so bound the run manually.
        run: |
          set -uo pipefail
          APP="${{ steps.app.outputs.path }}"
          BIN="$APP/Contents/MacOS/OpenConnect-GUI"
          LOG="$(mktemp)"

          "$BIN" >"$LOG" 2>&1 &
          PID=$!
          for _ in $(seq 1 10); do
            kill -0 "$PID" 2>/dev/null || break
            sleep 1
          done
          if kill -0 "$PID" 2>/dev/null; then
            echo "(still running after 10s — terminating; it got past dyld)"
            kill "$PID" 2>/dev/null || true
          fi
          wait "$PID" 2>/dev/null || true

          OUT="$(cat "$LOG")"
          echo "----- app output -----"
          echo "${OUT:-(no output)}"
          echo "----------------------"
          rm -f "$LOG"

          if printf '%s' "$OUT" | grep -qiE "Library not loaded|not a file|image not found|dyld: "; then
            echo "::error::dyld could not load a library — bundle is broken"
            exit 1
          fi
          echo "OK: dyld loaded the app (no load-time errors)."

      - name: Zip .app
        run: |
          set -euo pipefail
          APP="${{ steps.app.outputs.path }}"
          APP_DIR="$(dirname "$APP")"
          APP_NAME="$(basename "$APP")"
          OUT="OpenConnect-GUI-macos-arm64.zip"
          ( cd "$APP_DIR" && ditto -c -k --sequesterRsrc --keepParent "$APP_NAME" "$GITHUB_WORKSPACE/$OUT" )
          ls -lh "$GITHUB_WORKSPACE/$OUT"
          echo "ARTIFACT_FILE=$OUT" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenConnect-GUI-macos-arm64
          path: ${{ env.ARTIFACT_FILE }}
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        run: |
          {
            echo "### macOS arm64 build"
            echo ""
            echo "- Bundle: \`${{ steps.app.outputs.path }}\`"
            echo "- Artifact: \`${{ env.ARTIFACT_FILE }}\`"
            echo "- Deployment target: ${DEPLOYMENT_TARGET}"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Publish release
    needs: build-macos-arm64
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built artifact
        uses: actions/download-artifact@v4
        with:
          name: OpenConnect-GUI-macos-arm64
          path: dist

      - name: Resolve release tag and name
        id: rel
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ -n "${{ inputs.release_tag }}" ]; then
            TAG="${{ inputs.release_tag }}"
            TITLE="${{ inputs.release_tag }} (macOS arm64)"
            PRERELEASE="false"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            TITLE="${GITHUB_REF_NAME} (macOS arm64)"
            PRERELEASE="false"
          else
            # rolling release tracking the tip of main
            TAG="continuous"
            TITLE="Continuous build (macOS arm64)"
            PRERELEASE="true"
          fi
          echo "tag=$TAG"           >> "$GITHUB_OUTPUT"
          echo "title=$TITLE"       >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Resolved: tag=$TAG prerelease=$PRERELEASE"

      - name: Sanity-check artifact
        run: |
          set -euo pipefail
          ls -lh dist
          test -f dist/OpenConnect-GUI-macos-arm64.zip
          # guard against publishing the tiny, non-embedded bundle
          MIN=$((20 * 1024 * 1024))
          SIZE=$(stat -c%s dist/OpenConnect-GUI-macos-arm64.zip)
          echo "zip size: $SIZE bytes"
          if [ "$SIZE" -lt "$MIN" ]; then
            echo "::error::Artifact is only $SIZE bytes (<20MB); refusing to publish a non-standalone bundle"
            exit 1
          fi

      - name: Create / update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}   # no checkout here: gh cannot infer the repo
        run: |
          set -euo pipefail
          TAG="${{ steps.rel.outputs.tag }}"
          TITLE="${{ steps.rel.outputs.title }}"
          PRE="${{ steps.rel.outputs.prerelease }}"
          SHORT="${GITHUB_SHA::7}"
          REF="${GITHUB_REF_NAME}"

          cat > /tmp/notes.raw <<EOF
          macOS arm64 build of OpenConnect-GUI, auto-published from \`${SHORT}\` on \`${REF}\`.

          ### Install
          \`\`\`bash
          unzip OpenConnect-GUI-macos-arm64.zip
          xattr -dr com.apple.quarantine OpenConnect-GUI.app   # clear Gatekeeper
          sudo OpenConnect-GUI.app/Contents/MacOS/OpenConnect-GUI
          \`\`\`

          > Unsigned build: right-click the app -> Open the first time, or run the
          > \`xattr\` line above. Requires macOS 12+ on Apple Silicon.
          EOF
          # strip the YAML block-scalar indentation so markdown renders correctly
          sed 's/^          //' /tmp/notes.raw > /tmp/notes.md
          cat /tmp/notes.md

          if [ "$TAG" = "continuous" ]; then
            # Rolling release: recreate so the tag follows the tip of main.
            gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
            gh release create "$TAG" dist/OpenConnect-GUI-macos-arm64.zip \
              --target "$GITHUB_SHA" \
              --title "$TITLE" --notes-file /tmp/notes.md --prerelease
          elif gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists — refreshing asset"
            gh release upload "$TAG" dist/OpenConnect-GUI-macos-arm64.zip --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file /tmp/notes.md --prerelease="$PRE"
          else
            echo "Creating release $TAG"
            gh release create "$TAG" dist/OpenConnect-GUI-macos-arm64.zip \
              --target "$GITHUB_SHA" \
              --title "$TITLE" --notes-file /tmp/notes.md --prerelease="$PRE"
          fi

          gh release view "$TAG" --json tagName,name,isPrerelease,assets

      - name: Release summary
        run: |
          {
            echo "### Release"
            echo ""
            echo "- Tag: \`${{ steps.rel.outputs.tag }}\`"
            echo "- Prerelease: \`${{ steps.rel.outputs.prerelease }}\`"
            echo "- Asset: \`OpenConnect-GUI-macos-arm64.zip\`"
          } >> "$GITHUB_STEP_SUMMARY"
